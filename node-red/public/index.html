<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotionEdge Phase 7</title><link rel="stylesheet" href="/motionedge/style.css"></head><body>
<header><h1>MotionEdge 本地物联网监控</h1><span id="connection" class="badge offline">连接中</span></header>
<main><section><h2>设备概览</h2><div id="overview" class="grid"></div></section>
<section><h2>最近60秒姿态</h2><canvas id="chart" width="1000" height="300"></canvas></section>
<section><h2>系统健康</h2><div id="health" class="grid"></div></section>
<section><h2>设备命令</h2><div class="commands"><button data-command="ping">PING</button><button data-command="get_status">刷新状态</button><button data-command="get_config">读取配置</button><button data-command="start_calibration" data-confirm="请保持设备静止，确认开始校准？">启动校准</button><button data-command="set_stream_state" data-enabled="true">开启流</button><button data-command="set_stream_state" data-enabled="false">关闭流</button></div><pre id="response">尚无命令响应</pre></section>
<section><h2>配置持久化</h2><p>SET只修改RAM；确认参数安全后再显式保存。</p><div id="persistence" class="grid"></div><div class="commands"><button data-command="config_persist_status">持久化状态</button><button data-command="config_persist_save" data-confirm="确认控制和舵机均已禁用，然后保存配置？">保存配置</button><button data-command="config_persist_load">重新加载</button><button class="danger" data-command="config_factory_reset" data-confirm="危险操作：将清除两个Flash配置槽并恢复安全默认值，确定继续？">恢复出厂配置</button></div></section>
<section><h2>Phase 9A 执行器（仅手动）</h2><div id="actuator" class="grid"></div><div class="commands"><button data-command="actuator_status">状态</button><button data-command="actuator_arm" data-confirm="确认舵机独立5V供电、共地且运动范围无障碍，然后ARM？">ARM</button><button data-command="actuator_disarm">DISARM</button><button data-command="actuator_center">CENTER</button><button data-command="actuator_estop">ESTOP</button><button data-command="actuator_set_target" data-angle="-10">-10°</button><button data-command="actuator_set_target" data-angle="0">0°</button><button data-command="actuator_set_target" data-angle="10">+10°</button></div></section>
<section><h2>PID Attitude Control</h2><p>单MPU6500手持姿态驱动舵机；100 Hz PID运行在STM32本地，MQTT仅用于配置和监控。</p><div id="control" class="grid"></div><canvas id="controlChart" width="1000" height="300"></canvas><div class="commands"><button data-command="control_status">状态</button><button data-command="control_enable" data-axis="roll" data-confirm="确认外部5V、共地、舵机无遮挡且ESTOP可用，然后启用ROLL？">启用ROLL</button><button data-command="control_enable" data-axis="pitch" data-confirm="确认外部5V、共地、舵机无遮挡且ESTOP可用，然后启用PITCH？">启用PITCH</button><button data-command="control_disable">禁用</button><button data-command="control_zero">设置零位</button><button data-command="control_set_direction" data-direction="normal">Normal</button><button data-command="control_set_direction" data-direction="reverse">Reverse</button><button data-command="control_set_deadband" data-deadband="1">Deadband 1°</button><button data-command="control_set_pid" data-kp="1" data-kd="0">P-only</button><button data-command="control_set_pid" data-kp="1" data-kd="0.05">PD</button><button data-command="actuator_estop">ESTOP</button></div></section>
<p class="boundary">仅连接本机Mosquitto；未启用TLS，不适用于公网生产环境。</p></main><script src="/motionedge/app.js"></script></body></html>
