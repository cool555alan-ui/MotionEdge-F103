[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motionedge-motionctl"
version = "0.6.0"
description = "MotionEdge device CLI, capture, validation and report tools"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "matplotlib>=3.7,<4"]

[project.scripts]
motionctl = "motionctl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["motionctl*"]
